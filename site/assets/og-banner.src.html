<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter-Regular.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-SemiBold.ttf)}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;background:#000;overflow:hidden;font-family:Inter,sans-serif;color:#f5f5f7;-webkit-font-smoothing:antialiased}
.glow{position:absolute;inset:0;filter:blur(40px);background:
 radial-gradient(40% 55% at 78% 80%,rgba(191,90,242,.34),transparent 70%),
 radial-gradient(40% 55% at 60% 95%,rgba(255,55,95,.30),transparent 70%),
 radial-gradient(40% 55% at 95% 55%,rgba(255,159,10,.22),transparent 70%)}
.left{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:44px}
.brand img.i{width:84px;height:84px;border-radius:20px;box-shadow:0 12px 36px rgba(255,55,95,.3),0 0 0 1px rgba(255,255,255,.1)}
.brand img.w{height:40px}
h1{margin:0;font-size:92px;line-height:1.02;letter-spacing:-.045em;font-weight:600}
.g{background:linear-gradient(100deg,#ff9f0a 0%,#ff375f 50%,#bf5af2 100%);-webkit-background-clip:text;color:transparent}
p{margin:30px 0 0;font-size:27px;line-height:1.35;color:#98989f;letter-spacing:-.01em}
.tags{margin-top:34px;display:flex;gap:12px}
.tags span{font-size:20px;font-weight:600;padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.shot{position:absolute;left:660px;top:150px;width:760px;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 100px rgba(0,0,0,.8),0 20px 80px -10px rgba(255,55,95,.4)}
</style>
<div class="glow"></div>
<div class="left">
 <div class="brand"><img class="i" src="icon.png"><img class="w" src="wordmark.svg"></div>
 <h1>Your guitar.<br><span class="g">Any amp.</span></h1>
 <p>Free amp simulator with Neural Amp Modeler support.</p>
 <div class="tags"><span>Windows</span><span>VST3</span><span>Open source</span></div>
</div>
<img class="shot" src="../screenshots/main.png">
